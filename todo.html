<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --line:#e3e5ea;
    --ink:#1c1e26;
    --muted:#7b7f8a;
    --accent:#4f5dff;
    --accent-ink:#ffffff;
    --danger:#e2534a;
    --done:#2fb673;
    --shadow:0 6px 20px rgba(20,20,40,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:640px;margin:0 auto;padding:32px 18px 80px;}

  header{margin-bottom:20px;}
  header h1{font-size:26px;font-weight:800;margin:0 0 4px;}
  header p{margin:0;color:var(--muted);font-size:13.5px;}

  .stats{display:flex;gap:10px;margin:18px 0;}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);}
  .stat .n{font-size:22px;font-weight:800;}
  .stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;}

  form.add-form{
    display:flex;gap:8px;margin-bottom:16px;
  }
  form.add-form input[type=text]{
    flex:1;padding:13px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:14.5px;font-family:inherit;
  }
  form.add-form input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px;}
  form.add-form select, form.add-form input[type=date]{
    padding:13px 10px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink);font-size:13px;font-family:inherit;
  }
  form.add-form button{
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;
    padding:13px 18px;font-weight:700;font-size:14.5px;cursor:pointer;white-space:nowrap;
  }
  form.add-form button:active{transform:scale(0.98);}

  .filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .filters button{
    background:var(--card);border:1px solid var(--line);color:var(--muted);
    padding:7px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
  }
  .filters button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  li.item{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow);
  }
  li.item.done{opacity:0.55;}
  .check{
    width:22px;height:22px;border-radius:50%;border:2px solid var(--line);
    flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    background:transparent;
  }
  li.item.done .check{background:var(--done);border-color:var(--done);color:#fff;font-size:12px;}
  .body{flex:1;min-width:0;}
  .text{font-size:14.5px;font-weight:500;word-break:break-word;}
  li.item.done .text{text-decoration:line-through;}
  .meta{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;}
  .tag.p-high{background:#ffe3e1;color:var(--danger);}
  .tag.p-medium{background:#fff3d6;color:#a3760a;}
  .tag.p-low{background:#e4f5ea;color:var(--done);}
  .tag.due{background:#eef0ff;color:var(--accent);}
  .tag.due.overdue{background:#ffe3e1;color:var(--danger);}
  .del{
    background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;
    padding:2px 4px;line-height:1;flex-shrink:0;
  }
  .del:hover{color:var(--danger);}

  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>To-Do List</h1>
    <p>จัดการงานของคุณ — บันทึกอัตโนมัติในเบราว์เซอร์นี้</p>
  </header>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">ทั้งหมด</div></div>
    <div class="stat"><div class="n" id="statActive">0</div><div class="l">ค้างอยู่</div></div>
    <div class="stat"><div class="n" id="statDone">0</div><div class="l">เสร็จแล้ว</div></div>
  </div>

  <form class="add-form" id="addForm">
    <input type="text" id="taskInput" placeholder="เพิ่มงานใหม่..." autocomplete="off" required>
    <select id="priorityInput">
      <option value="medium">กลาง</option>
      <option value="high">สูง</option>
      <option value="low">ต่ำ</option>
    </select>
    <input type="date" id="dueInput">
    <button type="submit">เพิ่ม</button>
  </form>

  <div class="filters">
    <button data-filter="all" class="active">ทั้งหมด</button>
    <button data-filter="active">ค้างอยู่</button>
    <button data-filter="done">เสร็จแล้ว</button>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="emptyMsg" style="display:none;">ยังไม่มีงาน — เพิ่มงานแรกของคุณด้านบน</div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'todo-list-items-v1';
  let items = [];
  let filter = 'all';

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      items = raw ? JSON.parse(raw) : [];
    }catch(e){ items = []; }
  }
  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function priorityLabel(p){
    return {high:'สูง', medium:'กลาง', low:'ต่ำ'}[p] || p;
  }

  function render(){
    const list = document.getElementById('list');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';

    const visible = items.filter(it => {
      if(filter === 'active') return !it.done;
      if(filter === 'done') return it.done;
      return true;
    });

    emptyMsg.style.display = visible.length ? 'none' : 'block';

    visible.forEach(it => {
      const li = document.createElement('li');
      li.className = 'item' + (it.done ? ' done' : '');

      const check = document.createElement('button');
      check.className = 'check';
      check.type = 'button';
      check.setAttribute('aria-label', 'toggle done');
      check.textContent = it.done ? '✓' : '';
      check.addEventListener('click', () => toggleDone(it.id));

      const body = document.createElement('div');
      body.className = 'body';

      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = it.text;

      const meta = document.createElement('div');
      meta.className = 'meta';

      const pTag = document.createElement('span');
      pTag.className = 'tag p-' + it.priority;
      pTag.textContent = priorityLabel(it.priority);
      meta.appendChild(pTag);

      if(it.due){
        const dTag = document.createElement('span');
        const overdue = !it.done && it.due < todayStr();
        dTag.className = 'tag due' + (overdue ? ' overdue' : '');
        dTag.textContent = it.due;
        meta.appendChild(dTag);
      }

      body.appendChild(text);
      body.appendChild(meta);

      const del = document.createElement('button');
      del.className = 'del';
      del.type = 'button';
      del.setAttribute('aria-label', 'delete');
      del.textContent = '✕';
      del.addEventListener('click', () => removeItem(it.id));

      li.appendChild(check);
      li.appendChild(body);
      li.appendChild(del);
      list.appendChild(li);
    });

    document.getElementById('statTotal').textContent = items.length;
    document.getElementById('statActive').textContent = items.filter(it => !it.done).length;
    document.getElementById('statDone').textContent = items.filter(it => it.done).length;
  }

  function addItem(text, priority, due){
    items.unshift({ id: uid(), text, priority, due: due || '', done: false });
    save();
    render();
  }

  function toggleDone(id){
    const it = items.find(i => i.id === id);
    if(it){ it.done = !it.done; save(); render(); }
  }

  function removeItem(id){
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  document.getElementById('addForm').addEventListener('submit', function(e){
    e.preventDefault();
    const input = document.getElementById('taskInput');
    const priority = document.getElementById('priorityInput').value;
    const due = document.getElementById('dueInput').value;
    const text = input.value.trim();
    if(!text) return;
    addItem(text, priority, due);
    input.value = '';
    document.getElementById('dueInput').value = '';
    input.focus();
  });

  document.querySelectorAll('.filters button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  load();
  render();
})();
</script>
</body>
</html>
